<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DiyaVerse — Digital Festive Greeting & Celebration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-[#080415] text-amber-100 min-h-screen relative overflow-x-hidden select-none flex flex-col justify-between">
  <!-- Interactive Canvas Layer -->
  <canvas id="fireworksCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <!-- Sky Lanterns Layer -->
  <div id="lanternsContainer" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

  <!-- Header -->
  <header class="relative z-10 flex justify-between items-center px-6 pt-6 pb-2 max-w-5xl mx-auto w-full">
    <div class="flex items-center space-x-2">
      <span class="text-2xl animate-bounce">🪔</span>
      <span class="font-extrabold text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500">DiyaVerse</span>
    </div>
    
    <div class="flex items-center gap-3">
      <!-- Quick Mode Toggle -->
      <button id="sparklerModeBtn" class="px-3 py-1.5 rounded-full border border-amber-500/40 bg-amber-950/50 hover:bg-amber-800/40 transition text-xs font-semibold flex items-center gap-1.5 text-amber-200 shadow-md">
        <i class="fa-solid fa-wand-magic"></i>
        <span id="sparklerModeText">Sparkler Trail: OFF</span>
      </button>

      <!-- Audio Toggle -->
      <button id="audioToggle" class="px-3 py-1.5 rounded-full border border-yellow-500/40 bg-yellow-950/50 hover:bg-yellow-800/40 transition text-xs font-semibold flex items-center gap-1.5 text-yellow-300 shadow-md">
        <i class="fa-solid fa-bell" id="audioIcon"></i>
        <span id="audioText">Festive Chimes</span>
      </button>
    </div>
  </header>

  <main class="relative z-10 max-w-3xl mx-auto px-4 py-2 flex flex-col items-center text-center w-full">
    <!-- Personalized URL Banner -->
    <div id="personalizedBanner" class="hidden mb-4 p-3.5 rounded-2xl bg-amber-900/40 border border-amber-400/50 backdrop-blur-md max-w-lg shadow-[0_0_25px_rgba(245,158,11,0.25)] animate-pulse">
      <p class="text-[11px] uppercase tracking-widest text-amber-300 font-bold">Special Festive Blessing For</p>
      <h2 id="recipientNameDisplay" class="text-xl font-black text-yellow-300 tracking-wide mt-0.5"></h2>
      <p id="customWishDisplay" class="text-amber-100 text-xs mt-1 italic leading-relaxed"></p>
    </div>

    <!-- Main Title with Clean Margins & Non-Clipping Line-Height -->
    <div class="w-full max-w-xl px-4 mx-auto mt-2 mb-1">
      <h1 class="text-2xl sm:text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-500 drop-shadow-lg leading-normal py-1">
        Spark Lights of Joy & Hope
      </h1>
      <p class="text-amber-200/80 text-xs sm:text-sm max-w-md mx-auto mt-0.5">
        Kindle the sacred Diya to illuminate peace and good fortune. Tap anywhere in the night sky to launch vibrant fireworks!
      </p>
    </div>

    <!-- Interactive Diya Element -->
    <div class="my-4 relative flex flex-col items-center cursor-pointer group" id="diyaContainer">
      <div id="diyaGlow" class="absolute -top-12 w-36 h-36 rounded-full bg-amber-500/0 blur-3xl transition-all duration-700 pointer-events-none"></div>
      
      <!-- Diya Flame -->
      <div id="diyaFlame" class="relative w-8 h-14 rounded-[50%_50%_35%_35%/60%_60%_40%_40%] bg-gradient-to-t from-orange-600 via-amber-400 to-yellow-100 opacity-0 transition-opacity duration-500 filter drop-shadow-[0_0_20px_#ff9900]">
        <div class="absolute inset-1 rounded-full bg-white/50 blur-xs"></div>
      </div>

      <!-- Diya Clay Model -->
      <svg class="w-44 h-20 -mt-2.5 filter drop-shadow-2xl transition-transform duration-300 group-hover:scale-105 active:scale-95" viewBox="0 0 200 100">
        <path d="M 98 32 Q 100 20 105 18" stroke="#4a1e05" stroke-width="3" fill="none" />
        <path d="M 20 40 C 25 85, 175 85, 180 40 C 150 48, 50 48, 20 40 Z" fill="url(#clayGradient)" stroke="#d97706" stroke-width="2"/>
        <ellipse cx="100" cy="40" rx="80" ry="12" fill="#b45309" stroke="#f59e0b" stroke-width="1.5" />
        <ellipse cx="100" cy="41" rx="65" ry="8" fill="#78350f" />
        <defs>
          <linearGradient id="clayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#92400e" />
            <stop offset="50%" stop-color="#b45309" />
            <stop offset="100%" stop-color="#78350f" />
          </linearGradient>
        </defs>
      </svg>

      <span id="lightDiyaPrompt" class="mt-3 px-3.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-amber-500/20 border border-amber-400/40 text-amber-300 shadow-md">
        Tap to Kindle the Diya
      </span>
    </div>

    <!-- Festive Wish Creator Card -->
    <div class="w-full max-w-lg bg-amber-950/30 backdrop-blur-xl border border-amber-500/30 rounded-2xl p-5 shadow-[0_10px_35px_rgba(0,0,0,0.5)]">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-bold text-amber-300 flex items-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles text-yellow-400"></i> Festive Wish Creator
        </h3>
        <span class="text-[10px] bg-amber-500/10 text-amber-300 px-2.5 py-0.5 rounded-full border border-amber-400/30 font-medium">Instant Generator</span>
      </div>

      <div class="space-y-3 text-left text-xs">
        <div>
          <label class="block uppercase tracking-wider text-amber-200/80 mb-1 font-semibold">Recipient Name</label>
          <input type="text" id="recipientInput" placeholder="Enter name (e.g. Friends & Family)" class="w-full bg-black/50 border border-amber-500/30 rounded-xl px-3.5 py-2 text-amber-100 placeholder-amber-500/40 focus:outline-none focus:border-amber-400 transition" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block uppercase tracking-wider text-amber-200/80 mb-1 font-semibold">Tone</label>
            <select id="toneSelect" class="w-full bg-black/70 border border-amber-500/30 rounded-xl px-2.5 py-2 text-amber-200 focus:outline-none focus:border-amber-400">
              <option value="warm">Heartfelt & Warm</option>
              <option value="spiritual">Spiritual & Sanskrit Touch</option>
              <option value="energetic">Joyful & Energetic</option>
            </select>
          </div>
          <div>
            <label class="block uppercase tracking-wider text-amber-200/80 mb-1 font-semibold">Your Name</label>
            <input type="text" id="senderInput" placeholder="Your name" class="w-full bg-black/50 border border-amber-500/30 rounded-xl px-3.5 py-2 text-amber-100 placeholder-amber-500/40 focus:outline-none focus:border-amber-400 transition" />
          </div>
        </div>

        <button id="generateBtn" class="w-full py-2.5 rounded-xl font-bold text-stone-900 bg-gradient-to-r from-amber-400 via-yellow-400 to-amber-500 hover:brightness-110 active:scale-[0.99] transition shadow-md shadow-yellow-500/20 flex items-center justify-center gap-2 text-xs sm:text-sm mt-1">
          <i class="fa-solid fa-sparkles"></i> Generate Custom Blessing
        </button>
      </div>

      <!-- Output Card -->
      <div id="outputCard" class="hidden mt-3.5 p-3.5 rounded-xl bg-black/60 border border-amber-400/40 text-left">
        <p id="generatedWish" class="text-xs text-amber-100 italic leading-relaxed"></p>
        <div class="mt-2.5 flex gap-2">
          <button id="copyShareLink" class="flex-1 py-2 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/40 text-xs font-semibold text-amber-300 flex items-center justify-center gap-1.5 transition">
            <i class="fa-solid fa-link"></i> Copy Link
          </button>
          <button id="whatsappShare" class="flex-1 py-2 rounded-lg bg-emerald-600/30 hover:bg-emerald-600/50 border border-emerald-500/40 text-xs font-semibold text-emerald-300 flex items-center justify-center gap-1.5 transition">
            <i class="fa-brands fa-whatsapp"></i> WhatsApp
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 text-xs text-amber-400/50 relative z-10">
    Shubh Deepawali ✨
  </footer>

  <script src="app.js"></script>
</body>
</html>
